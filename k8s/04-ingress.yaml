apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pethub
  namespace: pethub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: pethub.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pethub-backend
                port: { number: 3000 }
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pethub-frontend
                port: { number: 80 }
