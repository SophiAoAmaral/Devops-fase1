apiVersion: apps/v1
kind: Deployment
metadata:
  name: pethub-frontend
  namespace: pethub
  labels: { app: pethub-frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: pethub-frontend }
  template:
    metadata:
      labels: { app: pethub-frontend }
    spec:
      containers:
        - name: web
          image: ghcr.io/sophiaoamaral/pethub-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pethub-frontend
  namespace: pethub
spec:
  type: ClusterIP
  selector: { app: pethub-frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
