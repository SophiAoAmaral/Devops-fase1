name: CD - PetHub

on:
  workflow_run:
    workflows: ["CI - PetHub"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da imagem a implantar (deixe vazio para usar o commit atual)'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGEM_API: ghcr.io/${{ github.repository_owner }}/pethub-api
  IMAGEM_WEB: ghcr.io/${{ github.repository_owner }}/pethub-web

jobs:
  build:
    name: Construir e publicar as imagens
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.versao.outputs.tag }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Definir a tag da versao
        id: versao
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar a imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: APP_VERSION=${{ steps.versao.outputs.tag }}
          tags: |
            ${{ env.IMAGEM_API }}:${{ steps.versao.outputs.tag }}
            ${{ env.IMAGEM_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir e publicar a imagem do front-end
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGEM_WEB }}:${{ steps.versao.outputs.tag }}
            ${{ env.IMAGEM_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  varredura:
    name: Varrer as imagens (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Autenticar no registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Procurar vulnerabilidades na imagem da API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGEM_API }}:${{ needs.build.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Procurar vulnerabilidades na imagem do front-end
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGEM_WEB }}:${{ needs.build.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  staging:
    name: Implantar em staging
    runs-on: ubuntu-latest
    needs: [build, varredura]
    environment:
      name: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Autenticar no registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a stack com as imagens publicadas
        env:
          REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/deploy.sh staging

      - name: Guardar os logs quando algo falhar
        if: failure()
        run: docker compose logs --no-color > logs-staging.txt || true

      - name: Publicar os logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-staging
          path: logs-staging.txt

  producao:
    name: Implantar em producao
    runs-on: ubuntu-latest
    needs: [build, staging]
    environment:
      name: producao
      url: https://pethub.exemplo.com.br
    permissions:
      contents: read
      packages: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Autenticar no registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Implantar a versao aprovada
        env:
          REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/deploy.sh producao

      - name: Reverter em caso de falha
        if: failure()
        env:
          REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: ./scripts/rollback.sh producao

      - name: Registrar a versao implantada
        run: echo "Versao ${{ needs.build.outputs.tag }} publicada em producao." >> "$GITHUB_STEP_SUMMARY"
