name: CI - PetHub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Back-end
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar as dependencias
        working-directory: backend
        run: npm ci

      - name: Verificar o estilo do codigo
        working-directory: backend
        run: npm run lint

      - name: Executar os testes
        working-directory: backend
        run: npm test

  frontend:
    name: Front-end
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar o estilo do codigo
        working-directory: frontend
        run: npm run lint

      - name: Executar os testes
        working-directory: frontend
        run: npm test

      - name: Gerar o build de producao
        working-directory: frontend
        run: npm run build

      - name: Guardar o build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  terraform:
    name: Infraestrutura
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Verificar a formatacao dos arquivos
        working-directory: infra
        run: terraform fmt -check

      - name: Inicializar
        working-directory: infra
        run: terraform init -backend=false

      - name: Validar a configuracao
        working-directory: infra
        run: terraform validate

  integracao:
    name: Integracao em containers
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Conferir a sintaxe do docker-compose
        run: docker compose config --quiet

      - name: Subir a stack completa
        run: ./scripts/deploy.sh local

      - name: Verificar o front-end e o proxy da API
        run: |
          curl -fs http://localhost:8080/ > /dev/null
          curl -fs http://localhost:8080/api/pets > /dev/null

      - name: Verificar se o Prometheus esta coletando a API
        run: |
          for i in $(seq 1 20); do
            estado=$(curl -fs 'http://localhost:9090/api/v1/targets?state=active' \
              | grep -o '"health":"up"' | head -1 || true)
            if [ -n "$estado" ]; then echo "Alvo coletado com sucesso."; exit 0; fi
            sleep 3
          done
          echo "O Prometheus nao coletou a API a tempo." >&2
          exit 1

      - name: Confirmar que o container nao roda como root
        run: |
          usuario=$(docker exec pethub-backend whoami)
          echo "A API roda como: $usuario"
          [ "$usuario" != "root" ]

      - name: Guardar os logs quando algo falhar
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  manifestos:
    name: Validar os manifests do Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validar os manifests contra o esquema do Kubernetes
        run: |
          kubeconform -strict -summary -kubernetes-version 1.30.0 \
            -ignore-filename-pattern 'kind-cluster.*' k8s/
