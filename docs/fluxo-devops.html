  <text x="50" y="52" font-size="33" font-weight="700" fill="#19266B">PetHub — fluxo DevOps completo</text>
  <text x="50" y="82" font-size="19" fill="#5A5F7A">Do commit à produção monitorada, com portões de qualidade e segurança, aprovação humana e rollback automático</text>

  <text class="etf" x="1010" y="118">o alerta em produção realimenta o próximo commit</text>

  <rect class="faixa" x="50" y="150" width="330" height="640" rx="14"/>
  <text class="rot" x="74" y="182">1 · DESENVOLVIMENTO</text>

  <rect class="cx" x="76" y="230" width="278" height="80" rx="10"/>
  <text class="tb" x="215" y="264">Commit na branch</text>
  <text class="tp" x="215" y="288">branch de trabalho</text>

  <rect class="cx" x="76" y="370" width="278" height="80" rx="10"/>
  <text class="tb" x="215" y="404">Verificação local</text>
  <text class="tp" x="215" y="428">npm run lint &amp;&amp; npm test</text>

  <rect class="cx" x="76" y="510" width="278" height="80" rx="10"/>
  <text class="tb" x="215" y="544">Pull request</text>
  <text class="tp" x="215" y="568">para a branch main</text>

  <path class="l" d="M 215 310 L 215 366"/>
  <path class="l" d="M 215 450 L 215 506"/>

  <rect class="faixa" x="404" y="150" width="420" height="640" rx="14"/>
  <text class="rot" x="428" y="182">2 · INTEGRAÇÃO CONTÍNUA</text>
  <text class="rots" x="428" y="203">.github/workflows/ci.yml</text>

  <rect class="cx" x="434" y="230" width="360" height="76" rx="10"/>
  <text class="tb" x="614" y="262">Lint e testes</text>
  <text class="tp" x="614" y="286">15 testes na API · 8 no front-end</text>

  <rect class="cx" x="434" y="356" width="360" height="76" rx="10"/>
  <text class="tb" x="614" y="388">Build e Terraform</text>
  <text class="tp" x="614" y="412">vite build · fmt · validate</text>

  <rect class="cx" x="434" y="482" width="360" height="76" rx="10"/>
  <text class="tb" x="614" y="514">Integração em containers</text>
  <text class="tp" x="614" y="538">stack completa + smoke test</text>

  <rect class="cx" x="434" y="608" width="360" height="76" rx="10"/>
  <text class="tb" x="614" y="640">Validação dos manifests</text>
  <text class="tp" x="614" y="664">kubeconform no diretório k8s/</text>

  <path class="l" d="M 614 306 L 614 352"/>
  <path class="l" d="M 614 432 L 614 478"/>
  <path class="l" d="M 614 558 L 614 604"/>

  <rect class="cx" x="878" y="230" width="360" height="76" rx="10"/>

  <text class="tp" x="1058" y="286">multi-stage · publica no GHCR</text>

  <text class="tb" x="1058" y="402">CRITICAL ou HIGH?</text>

  <path class="lr" d="M 1216 411 L 1288 448"/>

  <rect class="cx" x="878" y="480" width="360" height="76" rx="10"/>

  <text class="tp" x="1058" y="536">deploy.sh + smoke test</text>
  <path class="l" d="M 1058 448 L 1058 476"/>
  <text class="et" x="1096" y="470">limpo</text>

  <text class="tb" x="1058" y="640">Aprovação humana</text>

  <path class="l" d="M 1058 706 L 1058 732"/>

  <rect class="cx" x="1462" y="240" width="378" height="76" rx="10"/>

  <rect class="cx" x="1462" y="382" width="378" height="76" rx="10"/>

  <text class="tp" x="1750" y="614">latência · memória</text>

  <text class="tb" x="435" y="912" font-size="16">Gitleaks</text>
  <text class="tp" x="435" y="936" font-size="14">segredos</text>

  <rect class="cxs" x="514" y="874" width="134" height="92" rx="9"/>
  <text class="tb" x="581" y="912" font-size="16">Hadolint</text>
  <text class="tp" x="581" y="936" font-size="14">Dockerfile</text>

  <rect class="cxs" x="660" y="874" width="134" height="92" rx="9"/>
  <text class="tb" x="727" y="912" font-size="16">Trivy</text>
  <text class="tp" x="727" y="936" font-size="14">imagem e IaC</text>

  <text class="tp" x="437" y="1008" font-size="16">A cada push, pull request e toda segunda · uma falha crítica reprova o PR e trava a promoção</text>

  <rect class="faixa" x="848" y="818" width="1022" height="222" rx="14"/>
  <text class="rot" x="872" y="850">6 · VERIFICAÇÃO E ROLLBACK</text>
  <text class="rots" x="1244" y="850">scripts/smoke-test.sh e scripts/rollback.sh</text>

  <path class="dec" d="M 1010 886 L 1150 944 L 1010 1002 L 870 944 Z"/>
  <text class="tb" x="1010" y="938">Smoke test</text>
  <text class="tb" x="1010" y="962">passou?</text>

  <rect class="cxg" x="1220" y="874" width="614" height="64" rx="10"/>

  <rect class="cxr" x="1220" y="958" width="614" height="64" rx="10"/>
