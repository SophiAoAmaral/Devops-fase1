<!doctype html>
<meta charset="utf-8">
<style>*{margin:0;padding:0}body{width:1600px;height:900px;background:#fff}</style>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker>
    <style>
      .cx { fill:#fff; stroke:#1F3864; stroke-width:2; }
      .cxr{ fill:#fff; stroke:#B03A2E; stroke-width:2; }
      .t  { font-size:21px; fill:#1a1a1a; text-anchor:middle; }
      .n  { font-size:16px; font-weight:bold; fill:#1F3864; text-anchor:middle; }
      .l  { fill:none; stroke:#555; stroke-width:2; marker-end:url(#a); }
    </style>
  </defs>

  <text x="80" y="70" font-size="30" font-weight="bold" fill="#1F3864">Fluxo DevOps do PetHub</text>

  <rect class="cx" x="200" y="130" width="420" height="80" rx="6"/>
  <text class="n" x="230" y="163">1</text><text class="t" x="410" y="178">Commit na branch</text>

  <rect class="cx" x="200" y="260" width="420" height="80" rx="6"/>
  <text class="n" x="230" y="293">2</text><text class="t" x="410" y="308">Pull request para o main</text>

  <rect class="cx" x="200" y="390" width="420" height="80" rx="6"/>
  <text class="n" x="230" y="423">3</text><text class="t" x="410" y="438">CI: lint, testes e build</text>

  <rect class="cx" x="200" y="520" width="420" height="80" rx="6"/>
  <text class="n" x="230" y="553">4</text><text class="t" x="410" y="568">Merge no main</text>

  <rect class="cx" x="200" y="650" width="420" height="80" rx="6"/>
  <text class="n" x="230" y="683">5</text><text class="t" x="410" y="698">Build da imagem Docker</text>

  <path class="l" d="M 410 210 L 410 256"/>
  <path class="l" d="M 410 340 L 410 386"/>
  <path class="l" d="M 410 470 L 410 516"/>
  <path class="l" d="M 410 600 L 410 646"/>

  <path class="l" d="M 620 690 L 760 690 L 760 170 L 896 170"/>

  <rect class="cx" x="900" y="130" width="420" height="80" rx="6"/>
  <text class="n" x="930" y="163">6</text><text class="t" x="1110" y="178">Varredura de segurança</text>

  <rect class="cx" x="900" y="260" width="420" height="80" rx="6"/>
  <text class="n" x="930" y="293">7</text><text class="t" x="1110" y="308">Deploy em staging</text>

  <rect class="cx" x="900" y="390" width="420" height="80" rx="6"/>
  <text class="n" x="930" y="423">8</text><text class="t" x="1110" y="438">Aprovação manual</text>

  <rect class="cx" x="900" y="520" width="420" height="80" rx="6"/>
  <text class="n" x="930" y="553">9</text><text class="t" x="1110" y="568">Deploy em produção</text>

  <rect class="cx" x="900" y="650" width="420" height="80" rx="6"/>
  <text class="n" x="930" y="683">10</text><text class="t" x="1110" y="698">Monitoramento e alertas</text>

  <path class="l" d="M 1110 210 L 1110 256"/>
  <path class="l" d="M 1110 340 L 1110 386"/>
  <path class="l" d="M 1110 470 L 1110 516"/>
  <path class="l" d="M 1110 600 L 1110 646"/>

  <rect class="cxr" x="1370" y="520" width="180" height="80" rx="6"/>
  <text class="t" x="1460" y="553" font-size="19" fill="#B03A2E">Rollback</text>
  <text class="t" x="1460" y="577" font-size="19" fill="#B03A2E">automático</text>
  <path class="l" d="M 1320 560 L 1366 560" style="stroke:#B03A2E"/>
</svg>
